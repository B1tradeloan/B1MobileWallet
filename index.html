<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B1 Mobile Wallet - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="animated-cash">

  <div class="login-box">
    <h2>B1 MOBILE WALLET</h2>
    <p>E-Wallet Partnership</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <input type="text" id="username" placeholder="Username or GCash Number" required>
      <input type="password" id="password" placeholder="Password or PIN" required>

      <div class="role-select">
        <label><input type="radio" name="role" value="user" checked> User</label>
        <label><input type="radio" name="role" value="admin"> Admin</label>
      </div>

      <button type="submit">Login</button>
    </form>

    <footer>
      <a href="contact.html">Contact Us</a>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
